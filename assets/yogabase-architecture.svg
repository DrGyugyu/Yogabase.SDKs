  <rect x="640" y="272" width="370" height="92" rx="14" fill="#ffffff" stroke="#c7dcec" stroke-width="1.5"/>
  <text x="662" y="302" class="node">Operations and approvals</text>
  <text x="662" y="326" class="text">revision-checked, audited intent</text>
  <text x="662" y="348" class="text">installation approval policy</text>

  <rect x="1050" y="272" width="310" height="92" rx="14" fill="#ffffff" stroke="#c7dcec" stroke-width="1.5"/>
