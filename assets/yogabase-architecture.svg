<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
  <title id="title">Yogabase Control Plane and member architecture</title>
  <desc id="description">A platform operator works through the Console and REST API. The Control Plane stores operations in a YSQL catalog and sends signed intent over an agent-initiated mTLS connection to a member agent. The local actuator reconciles YugabyteDB and approved application roles.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef4f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2342" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#466785"/>
    </marker>
    <style>
      .title { font: 700 35px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #102a43; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #5c7185; }
      .groupTitle { font: 700 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #17324d; }
      .groupNote { font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #62788d; }
      .nodeTitle { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #102a43; }
      .nodeText { font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4e6478; }
      .edgeText { font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #466785; }
      .line { fill: none; stroke: #466785; stroke-width: 3; marker-end: url(#arrow); }
      .mutual { fill: none; stroke: #138b8d; stroke-width: 3; stroke-dasharray: 9 8; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="800" fill="url(#background)"/>
  <text x="64" y="72" class="title">How Yogabase works</text>
  <text x="64" y="106" class="subtitle">One authoritative Control Plane; outbound-connected members reconcile only signed, allowlisted intent.</text>

  <rect x="42" y="322" width="238" height="136" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="90" cy="370" r="25" fill="#e1f5f3"/>
  <path d="M90 352 v24 M78 364 h24 M82 382 h16" fill="none" stroke="#138b8d" stroke-width="3" stroke-linecap="round"/>
  <text x="128" y="370" class="nodeTitle">Platform operator</text>
  <text x="128" y="398" class="nodeText">plans and approves changes</text>

  <rect x="352" y="154" width="538" height="536" rx="24" fill="#eef5fb" stroke="#c7dcec" stroke-width="2"/>
  <text x="388" y="204" class="groupTitle">Control Plane installation</text>
  <text x="388" y="231" class="groupNote">sole authority for accepted management intent</text>

  <rect x="388" y="284" width="206" height="112" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <text x="412" y="329" class="nodeTitle">Console and REST API</text>
  <text x="412" y="356" class="nodeText">preview and submit</text>

  <rect x="650" y="284" width="204" height="112" rx="16" fill="#ddecfa" stroke="#91b8d7" stroke-width="2"/>
  <text x="674" y="329" class="nodeTitle">Control Plane</text>
  <text x="674" y="356" class="nodeText">policy, approval, audit</text>

  <rect x="426" y="505" width="194" height="112" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <text x="450" y="550" class="nodeTitle">YSQL catalog</text>
  <text x="450" y="577" class="nodeText">durable operations</text>

  <rect x="654" y="505" width="164" height="112" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <text x="678" y="550" class="nodeTitle">Provisioner</text>
  <text x="678" y="577" class="nodeText">cloud lifecycle</text>

  <rect x="1000" y="154" width="554" height="536" rx="24" fill="#eef8f5" stroke="#b7ddd4" stroke-width="2"/>
  <text x="1038" y="204" class="groupTitle">Managed member target</text>
  <text x="1038" y="231" class="groupNote">local execution remains subordinate to the Control Plane</text>

  <rect x="1038" y="284" width="212" height="112" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <text x="1062" y="329" class="nodeTitle">Outbound fleet agent</text>
  <text x="1062" y="356" class="nodeText">persists signed intent</text>

  <rect x="1294" y="284" width="220" height="112" rx="16" fill="#dff4ec" stroke="#8ac7b7" stroke-width="2"/>
  <text x="1318" y="329" class="nodeTitle">Local actuator</text>
  <text x="1318" y="356" class="nodeText">deterministic reconciliation</text>

  <rect x="1133" y="505" width="276" height="112" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <text x="1157" y="550" class="nodeTitle">Kubernetes workloads</text>
  <text x="1157" y="577" class="nodeText">YugabyteDB and approved runtime roles</text>

  <path d="M280 390 H388" class="line"/>
  <text x="292" y="365" class="edgeText">uses</text>
  <path d="M594 340 H650" class="line"/>
  <path d="M752 396 V505 H523" class="line"/>
  <path d="M752 396 V505 H736" class="line"/>
  <path d="M854 340 H1038" class="mutual"/>
  <text x="876" y="305" class="edgeText">agent-initiated mTLS gRPC</text>
  <path d="M1250 340 H1294" class="line"/>
  <path d="M1404 396 V456 H1271 V505" class="line"/>

  <rect x="64" y="730" width="1472" height="1" fill="#c9d8e4"/>
  <text x="64" y="768" class="subtitle">The actuator writes Yogabase-owned workloads only. It cannot originate policy, read arbitrary Secrets, or use remote shell or pods/exec workflows.</text>
</svg>
