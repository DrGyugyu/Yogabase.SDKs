  <text x="1056" y="824" class="node">artifact-admission</text>
  <text x="1056" y="847" class="text">isolated Job: inventory and scan</text>
  <path d="M1056 859 H1344" fill="none" stroke="#d6ebe5" stroke-width="1.5"/>
  <text x="1056" y="884" class="node">schema-runner</text>
  <text x="1056" y="906" class="text">DDL/DML as digest-bound migrations</text>

