  <!-- Legend and the fleet session -->
  <rect x="40" y="398" width="28" height="18" rx="5" fill="#f3effa" stroke="#b7a3de" stroke-width="1.5"/>
  <text x="80" y="412" class="fleetText">SDK or client entry point</text>
