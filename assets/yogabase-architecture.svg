  <text x="40" y="162" class="group">Control Plane</text>
  <text x="40" y="188" class="mode">chart mode: control-plane</text>
  <text x="40" y="212" class="groupNote">sole authority for accepted intent</text>

  <rect x="350" y="136" width="210" height="92" rx="14" fill="#ffffff" stroke="#c7dcec" stroke-width="1.5"/>
  <text x="370" y="166" class="node">REST API</text>
  <text x="370" y="190" class="text">/api/v1</text>
  <text x="370" y="212" class="text">preview, then submit</text>

  <rect x="580" y="136" width="245" height="92" rx="14" fill="#ffffff" stroke="#c7dcec" stroke-width="1.5"/>
  <text x="600" y="166" class="node">Blazor Console</text>
  <text x="600" y="190" class="text">sign-in: named seats</text>
  <text x="600" y="212" class="text">or external OIDC</text>

  <rect x="845" y="136" width="245" height="92" rx="14" fill="#ffffff" stroke="#c7dcec" stroke-width="1.5"/>
  <text x="865" y="166" class="node">Delivery API</text>
  <text x="865" y="190" class="text">/api/v1/delivery</text>
  <text x="865" y="212" class="text">separate TLS host</text>

  <rect x="1110" y="136" width="250" height="92" rx="14" fill="#ffffff" stroke="#c7dcec" stroke-width="1.5"/>
  <text x="1130" y="166" class="node">Builds ingest</text>
  <text x="1130" y="190" class="text">/api/v1/projects/…/builds</text>
  <text x="1130" y="212" class="text">project-scoped ybt_ token</text>

