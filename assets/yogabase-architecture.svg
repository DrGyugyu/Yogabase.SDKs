  <path d="M40 459 H68" fill="none" stroke="#138b8d" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="80" y="464" class="fleetText">outbound fleet session</text>

  <text x="1184" y="408" class="fleet" text-anchor="end">The Agent dials out over mutually authenticated gRPC</text>
  <text x="1184" y="430" class="fleetText" text-anchor="end">signed intent down · inventory and observations up · no inbound member API</text>
  <text x="1184" y="452" class="fleetText" text-anchor="end">also relays console Lambda and schema-runner calls, runtime-host calls, /v1/servers/*</text>

  <!-- Member cluster -->
  <rect x="270" y="470" width="1110" height="556" rx="20" fill="#eef8f5" stroke="#b7ddd4" stroke-width="2"/>
  <text x="290" y="502" class="group">Member cluster</text>
  <text x="460" y="502" class="mode">chart mode: member</text>
  <text x="620" y="502" class="groupNote">· the Control Plane's own cluster enrolls itself as a member too</text>
