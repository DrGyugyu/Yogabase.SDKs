  <rect x="706" y="698" width="268" height="204" rx="10" fill="#eef8f5" stroke="#b7ddd4" stroke-width="1.5"/>
  <text x="722" y="724" class="sub">Sandbox</text>
  <text x="722" y="747" class="fleetText">sandbox-broker → sandbox-worker</text>
  <rect x="720" y="760" width="240" height="130" rx="10" fill="#f3effa" stroke="#b7a3de" stroke-width="1.5"/>
