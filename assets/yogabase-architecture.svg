  <text x="312" y="598" class="text">/v1/storage · /v1/servers/*</text>
  <text x="312" y="620" class="text">function, actor, workflow invoke</text>
  <text x="312" y="642" class="text">internal /v1/lambda-runtime/</text>

  <rect x="290" y="672" width="295" height="70" rx="14" fill="#ffffff" stroke="#b7ddd4" stroke-width="1.5"/>
