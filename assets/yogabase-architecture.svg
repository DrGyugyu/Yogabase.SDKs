<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
  <title id="title">How Yogabase works: the Control Plane, a member cluster, and where each SDK connects</title>
  <desc id="desc">One Helm chart runs in two modes. In control-plane mode the Control Plane is the sole authority: a Blazor Console whose sign-in uses named seats or an external OIDC provider, the REST API under /api/v1, the workload-only Delivery API under /api/v1/delivery on its own TLS host, and the Builds ingest route authorized by a project-scoped ybt_ developer token all feed revision-checked, audited operations and approvals under the installation approval policy, recorded in an internal YSQL catalog that is RF1 by default. A fleet gateway sends signed, sequenced commands. An optional Provisioner, Pulumi .NET behind ICloudProvisioner, renders only when provisioning is enabled. In each member cluster, and in the Control Plane's own cluster, which enrolls itself, the Agent dials out to the fleet gateway over mutually authenticated gRPC: signed intent flows down, inventory and observations flow up, and no inbound member API exists. The same session relays console Lambda and schema-runner calls, runtime-host calls and /v1/servers calls. The Agent persists signed Yogabase CRDs; the local actuator, Yogabase.Operator, is the only writer of Yogabase workloads and reconciles YogaDatabase, YogaDatabaseOperation, YogaApplicationRuntime, YogaValkey and YogaRobustMQCluster. Yogabase.Tasks roles include the application-gateway, the realtime-gateway for SignalR, hosted services run by service-materializer and service-host, Lambda execution by lambda-worker, scheduler, jobs, consumer, artifact-builder and the sandbox-broker and sandbox-worker, an optional orleans-silo that is the only process running Orleans, schema-runner for console DDL and DML as digest-bound migrations, artifact-admission, and an optional object-store. Engines are YugabyteDB with YSQL only, and the optional Valkey and RobustMQ modules, reconciled by Yogabase-owned C# code. Application SDKs for .NET, TypeScript, Python, Java and Dart call the application gateway over HTTPS and the realtime gateway over SignalR on its own origin; a game client dials the allocated instance's host and port directly; the Delivery client calls the Delivery API; YogabaseBuildsClient and the Unity Editor publisher call Builds ingest; the runtime-host client in a hosted server Pod speaks only to its Pod-local relay; Yogabase.Lambda in the sandbox reaches the project database through DbDataSource, the gateway's internal Lambda runtime API for Storage, Users, Realtime and MQTT, Kafka or AMQP publication, and Valkey directly over TLS under a project ACL identity. Secret values never reach browser state, CRD status, logs or audit records. The client Data API was restored in the product on 2026-09-23 and is not drawn, and the SDKs' Lambda wrapper has no typed data API or Entity Framework Core yet (decided 2026-09-17).</desc>
