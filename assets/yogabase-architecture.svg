  <text x="865" y="50" class="sdk">Delivery client (CI)</text>
  <text x="865" y="75" class="sdkText">workload OIDC token</text>

  <rect x="1110" y="20" width="250" height="72" rx="14" fill="#f3effa" stroke="#b7a3de" stroke-width="1.5"/>
  <text x="1130" y="50" class="sdk">YogabaseBuildsClient</text>
  <text x="1130" y="75" class="sdkText">or Unity Editor publisher</text>

