  <text x="734" y="806" class="sdkText">DbDataSource: project DB</text>
  <text x="734" y="826" class="sdkText">gateway: Storage · Users ·</text>
  <text x="734" y="846" class="sdkText">Realtime · MQTT/Kafka/AMQP</text>
  <text x="734" y="866" class="sdkText">Valkey: direct TLS, ACL</text>

