<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="1040" height="660" font-family="Helvetica, Arial, sans-serif">
  <title>Yogabase (EKS Beta) architecture — everything operational stays inside the customer's AWS account</title>
  <desc>Yogabase runs entirely inside the customer's AWS account. A Control Plane cluster hosts the console, API, provisioner and an internal catalog alongside a YugabyteDB node pool. Member clusters connect outbound only. The only paths crossing the account boundary are sign-in federation, container image pulls from AWS Marketplace ECR, and an optional customer-owned backup destination.</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#2f5597"/>
    </marker>
    <marker id="arrowgrey" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#5a6b82"/>
    </marker>
  </defs>

  <rect width="1040" height="660" fill="#ffffff"/>

  <text x="24" y="34" font-size="20" font-weight="bold" fill="#1f3864">Yogabase (EKS Beta)</text>
  <text x="24" y="52" font-size="12.5" fill="#5a6b82">One control plane for operating YugabyteDB on Amazon EKS — running entirely in your own account.</text>

  <!-- Account boundary -->
  <rect x="24" y="64" width="820" height="572" rx="12" fill="#f7f9fc" stroke="#1f3864" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="44" y="90" font-size="17" font-weight="bold" fill="#1f3864">Your AWS account</text>
  <text x="44" y="110" font-size="12.5" fill="#41546f">Every database, every secret, and all operational state stays inside this boundary.</text>

  <!-- Control Plane cluster -->
  <rect x="48" y="130" width="422" height="332" rx="10" fill="#ffffff" stroke="#2f5597" stroke-width="2"/>
  <text x="66" y="154" font-size="14.5" font-weight="bold" fill="#2f5597">Amazon EKS — Control Plane cluster</text>
  <text x="66" y="172" font-size="11.5" fill="#5a6b82">Installed once, from the Yogabase Helm chart</text>

  <rect x="66" y="186" width="180" height="68" rx="7" fill="#eaf1fb" stroke="#2f5597"/>
  <text x="80" y="208" font-size="12.5" font-weight="bold" fill="#1f3864">Console &amp; REST API</text>
  <text x="80" y="226" font-size="10.5" fill="#41546f">Blazor console, guarded</text>
  <text x="80" y="241" font-size="10.5" fill="#41546f">operations, approvals</text>

  <rect x="258" y="186" width="194" height="68" rx="7" fill="#eaf1fb" stroke="#2f5597"/>
  <text x="272" y="208" font-size="12.5" font-weight="bold" fill="#1f3864">Provisioner</text>
  <text x="272" y="226" font-size="10.5" fill="#41546f">Pulumi programs; encrypted</text>
  <text x="272" y="241" font-size="10.5" fill="#41546f">state kept in-cluster</text>

  <rect x="66" y="266" width="180" height="66" rx="7" fill="#eaf1fb" stroke="#2f5597"/>
  <text x="80" y="288" font-size="12.5" font-weight="bold" fill="#1f3864">Internal catalog</text>
  <text x="80" y="306" font-size="10.5" fill="#41546f">Yogabase's own metadata</text>
  <text x="80" y="321" font-size="10.5" fill="#41546f">database (RF1)</text>

  <rect x="258" y="266" width="194" height="66" rx="7" fill="#eaf1fb" stroke="#2f5597"/>
  <text x="272" y="288" font-size="12.5" font-weight="bold" fill="#1f3864">Local actuator</text>
  <text x="272" y="306" font-size="10.5" fill="#41546f">Sole writer of Yogabase-</text>
  <text x="272" y="321" font-size="10.5" fill="#41546f">authored workloads</text>

  <rect x="66" y="344" width="386" height="100" rx="7" fill="#fdf3e3" stroke="#b26a00" stroke-width="1.6"/>
  <text x="80" y="367" font-size="13" font-weight="bold" fill="#8a5200">YugabyteDB node pool</text>
  <text x="80" y="387" font-size="11" fill="#6b4a12">Your databases. YSQL only, replication factor 1 in this beta.</text>
  <text x="80" y="405" font-size="11" fill="#6b4a12">Purpose-scoped engine image: no shell, no package manager, non-root,</text>
  <text x="80" y="423" font-size="11" fill="#6b4a12">pinned by digest, PostgreSQL 15.19 security baseline.</text>

  <!-- Member cluster -->
  <rect x="560" y="130" width="260" height="196" rx="10" fill="#ffffff" stroke="#2f5597" stroke-width="2"/>
  <text x="578" y="154" font-size="14" font-weight="bold" fill="#2f5597">Amazon EKS — member</text>
  <text x="578" y="172" font-size="11.5" fill="#5a6b82">Optional; same chart, member mode</text>

  <rect x="578" y="186" width="224" height="76" rx="7" fill="#eaf1fb" stroke="#2f5597"/>
  <text x="592" y="207" font-size="12.5" font-weight="bold" fill="#1f3864">Agent + local actuator</text>
  <text x="592" y="225" font-size="10.5" fill="#41546f">Connects out to the Control Plane</text>
  <text x="592" y="240" font-size="10.5" fill="#41546f">over mutually authenticated gRPC.</text>
  <text x="592" y="255" font-size="10.5" font-weight="bold" fill="#1f3864">No inbound endpoint.</text>

  <rect x="578" y="274" width="224" height="38" rx="7" fill="#fdf3e3" stroke="#b26a00" stroke-width="1.6"/>
  <text x="592" y="298" font-size="11" fill="#6b4a12">Billed per Yogabase-owned vCPU</text>

  <!-- Outbound-only connection, drawn in the gutter between the two clusters -->
  <path d="M 558 216 L 472 216" stroke="#2f5597" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <text x="515" y="207" font-size="10" font-weight="bold" fill="#2f5597" text-anchor="middle">outbound</text>
  <text x="515" y="232" font-size="10" fill="#5a6b82" text-anchor="middle">only</text>

  <!-- Identity -->
  <rect x="560" y="344" width="260" height="100" rx="10" fill="#ffffff" stroke="#2f7d4f" stroke-width="2"/>
  <text x="578" y="368" font-size="13.5" font-weight="bold" fill="#2f7d4f">Sign-in, in your account</text>
  <text x="578" y="388" font-size="11" fill="#41546f">IAM Identity Center, federated</text>
  <text x="578" y="405" font-size="11" fill="#41546f">through an installation-owned</text>
  <text x="578" y="422" font-size="11" fill="#41546f">Amazon Cognito user pool.</text>
  <text x="578" y="438" font-size="11" font-weight="bold" fill="#2f7d4f">No password database.</text>

  <!-- Optional backup -->
  <rect x="48" y="476" width="422" height="80" rx="10" fill="#ffffff" stroke="#5a6b82" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="66" y="500" font-size="13" font-weight="bold" fill="#41546f">Backup destination (optional, off by default)</text>
  <text x="66" y="520" font-size="11" fill="#5a6b82">An object store you own and configure. Yogabase never</text>
  <text x="66" y="538" font-size="11" fill="#5a6b82">chooses a destination for you.</text>

  <rect x="560" y="476" width="260" height="80" rx="10" fill="#ffffff" stroke="#5a6b82" stroke-width="1.8"/>
  <text x="578" y="500" font-size="13" font-weight="bold" fill="#41546f">What is not here</text>
  <text x="578" y="520" font-size="11" fill="#5a6b82">No vendor-hosted service, no</text>
  <text x="578" y="538" font-size="11" fill="#5a6b82">telemetry, no phone-home.</text>

  <text x="48" y="584" font-size="11" fill="#5a6b82">Secret material exists only as Kubernetes Secrets in your clusters — never in Helm values, resource status, logs,</text>
  <text x="48" y="602" font-size="11" fill="#5a6b82">audit records, support bundles, or browser state.</text>

  <!-- Outside the account -->
  <rect x="868" y="130" width="148" height="118" rx="10" fill="#f2f2f5" stroke="#5a6b82" stroke-width="1.8"/>
  <text x="882" y="154" font-size="12.5" font-weight="bold" fill="#41546f">AWS Marketplace</text>
  <text x="882" y="171" font-size="12.5" font-weight="bold" fill="#41546f">ECR</text>
  <text x="882" y="194" font-size="10.5" fill="#5a6b82">Signed, digest-pinned</text>
  <text x="882" y="211" font-size="10.5" fill="#5a6b82">images for amd64</text>
  <text x="882" y="228" font-size="10.5" fill="#5a6b82">and arm64</text>

  <path d="M 866 268 L 846 268" stroke="#5a6b82" stroke-width="2.2" fill="none" marker-end="url(#arrowgrey)"/>
  <text x="1016" y="268" font-size="10.5" fill="#5a6b82" text-anchor="end">image pulls</text>

  <text x="868" y="326" font-size="11.5" font-weight="bold" fill="#41546f">Crossing the boundary:</text>
  <text x="868" y="350" font-size="10.5" fill="#5a6b82">1. Sign-in federation</text>
  <text x="868" y="368" font-size="10.5" fill="#5a6b82">2. Image pulls</text>
  <text x="868" y="386" font-size="10.5" fill="#5a6b82">3. A backup target you</text>
  <text x="868" y="402" font-size="10.5" fill="#5a6b82">    choose</text>
  <text x="868" y="428" font-size="10.5" font-weight="bold" fill="#41546f">Nothing else.</text>
</svg>
