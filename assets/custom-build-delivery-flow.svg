<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1200" viewBox="0 0 1280 1200" role="img" aria-labelledby="title desc">
  <title id="title">Custom build delivery: one upload through the Control Plane to Kubernetes</title>
  <desc id="desc">A developer uploads one archive through the console upload page, or with a project-scoped ybt_ developer token through the yogabase CLI, YogabaseBuildsClient or the Unity Editor's Publish Server window. The Control Plane's Builds ingest stages it and derives the service layout and a detached manifest from the archive and any declared name, version and ports. Signed intent sends it to the member's isolated artifact-admission Job, which derives the CycloneDX inventory, scans it with the C# OSV matcher against the pinned snapshot, and signs manifest, inventory and scan with the installation admission key. The Control Plane re-verifies the signed result and reports the build check. A release is a runtime command under the installation approval policy; the local actuator writes one Deployment per release, service-materializer verifies the admitted object and service-host runs the entrypoint without Kubernetes or cloud credentials. Instances report lifecycle through the Runtime Host v1 contract over their Pod-local relay, and players allocate an instance through /v1/servers and dial its host and port. The Delivery API for CI is a separate, off-by-default path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#466785"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#138b8d"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Helvetica, Arial, sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #102a43; }
      .subtitle { font-size: 17px; fill: #4e6478; }
      .group { font-size: 20px; font-weight: 700; fill: #17324d; }
      .groupNote { font-size: 14.5px; fill: #4e6478; }
      .node { font-size: 17.5px; font-weight: 700; fill: #102a43; }
      .sdkNode { font-size: 17.5px; font-weight: 700; fill: #4b2e83; }
      .text { font-size: 15px; fill: #4e6478; }
      .code { font-size: 14.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #4b2e83; }
      .edge { font-size: 13.5px; font-weight: 700; fill: #466785; }
      .edgeTeal { font-size: 13.5px; font-weight: 700; fill: #0f6f71; }
      .foot { font-size: 15px; fill: #4e6478; }
      .footStrong { font-size: 15px; font-weight: 700; fill: #17324d; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="1200" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1279" height="1199" fill="none" stroke="#d9e2ec"/>

  <text x="40" y="58" class="title">Custom build → Control Plane → Kubernetes</text>
  <text x="40" y="88" class="subtitle">One upload: Yogabase derives the manifest and inventory, scans and signs the build, and releases it through the member.</text>

  <!-- Columns -->
  <rect x="40" y="108" width="280" height="986" rx="20" fill="#f8f5fd" stroke="#d9ccef" stroke-width="1.5"/>
  <text x="60" y="140" class="group">You and the SDKs</text>
  <text x="60" y="162" class="groupNote">developer tools and players</text>

  <rect x="380" y="108" width="380" height="986" rx="20" fill="#eef5fb" stroke="#c7dcec" stroke-width="1.5"/>
  <text x="400" y="140" class="group">Control Plane</text>
  <text x="400" y="162" class="groupNote">the sole authority for accepted intent</text>

  <rect x="820" y="108" width="420" height="986" rx="20" fill="#eef8f5" stroke="#b7ddd4" stroke-width="1.5"/>
  <text x="840" y="140" class="group">Member cluster</text>
  <text x="840" y="162" class="groupNote">Agent, local actuator and Tasks roles</text>

  <!-- 1 Upload -->
  <rect x="56" y="184" width="248" height="160" rx="14" fill="#f3effa" stroke="#b7a3de" stroke-width="1.5"/>
  <text x="76" y="212" class="sdkNode">1  Upload one archive</text>
  <text x="76" y="238" class="text">console upload page, or with a</text>
  <text x="76" y="260" class="text"><tspan class="code">ybt_</tspan> developer token:</text>
  <text x="76" y="282" class="code">yogabase build upload</text>
  <text x="76" y="304" class="code">YogabaseBuildsClient</text>
  <text x="76" y="326" class="text">Unity Editor Publish Server</text>

  <rect x="396" y="184" width="348" height="160" rx="14" fill="#ffffff" stroke="#91b8d7" stroke-width="1.5"/>
  <text x="416" y="212" class="node">Builds ingest</text>
  <text x="416" y="238" class="text">stages the archive</text>
  <text x="416" y="260" class="text">derives the service layout and a</text>
  <text x="416" y="282" class="text">detached manifest from the archive</text>
  <text x="416" y="304" class="text">and any declared name, version, ports</text>
  <text x="416" y="332" class="text">build state: checking</text>

  <path d="M304 264 H390" fill="none" stroke="#466785" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="326" y="254" class="edge">POST</text>

  <!-- 2 Admission -->
  <path d="M570 344 V420 H830" fill="none" stroke="#138b8d" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrowTeal)"/>
  <text x="584" y="410" class="edgeTeal">signed intent (fleet)</text>

  <rect x="836" y="374" width="388" height="190" rx="14" fill="#ffffff" stroke="#8ac7b7" stroke-width="1.5"/>
  <text x="856" y="402" class="node">2  artifact-admission Job</text>
  <text x="856" y="428" class="text">isolated and non-executing</text>
  <text x="856" y="450" class="text">derives the CycloneDX inventory</text>
  <text x="856" y="472" class="text">scans it with the C# OSV matcher</text>
  <text x="856" y="494" class="text">against the pinned OSV snapshot</text>
  <text x="856" y="516" class="text">signs manifest, inventory and scan</text>
  <text x="856" y="538" class="text">with the installation admission key</text>

  <!-- 3 Build check -->
  <path d="M1180 564 V644 H750" fill="none" stroke="#138b8d" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrowTeal)"/>
  <text x="840" y="634" class="edgeTeal">signed observation (fleet)</text>

  <rect x="396" y="594" width="348" height="100" rx="14" fill="#ffffff" stroke="#91b8d7" stroke-width="1.5"/>
  <text x="416" y="622" class="node">3  Build check</text>
  <text x="416" y="648" class="text">re-verifies the signed result: admitted,</text>
  <text x="416" y="670" class="text">or refused with CVE, package, fixed-in</text>

  <rect x="56" y="594" width="248" height="100" rx="14" fill="#f3effa" stroke="#b7a3de" stroke-width="1.5"/>
  <text x="76" y="622" class="sdkNode">Read the check</text>
  <text x="76" y="648" class="code">GET …/builds/{buildId}</text>
  <text x="76" y="670" class="text">the CLI polls until terminal</text>

  <path d="M396 644 H310" fill="none" stroke="#466785" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="330" y="634" class="edge">GET</text>

  <!-- 4 Release -->
  <path d="M570 694 V718" fill="none" stroke="#466785" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="396" y="724" width="348" height="110" rx="14" fill="#ffffff" stroke="#91b8d7" stroke-width="1.5"/>
  <text x="416" y="752" class="node">4  Release</text>
  <text x="416" y="778" class="text">a runtime command under the</text>
  <text x="416" y="800" class="text">installation approval policy, from</text>
  <text x="416" y="822" class="text">the console or the Delivery API</text>

  <path d="M744 778 H830" fill="none" stroke="#138b8d" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrowTeal)"/>
  <text x="768" y="768" class="edgeTeal">fleet</text>

  <rect x="836" y="724" width="388" height="200" rx="14" fill="#ffffff" stroke="#8ac7b7" stroke-width="1.5"/>
  <text x="856" y="752" class="node">Hosted-service Pods</text>
  <text x="856" y="778" class="text">local actuator: one Deployment per release</text>
  <text x="856" y="800" class="text"><tspan class="code">service-materializer</tspan> re-fetches and</text>
  <text x="856" y="822" class="text">verifies the exact admitted object</text>
  <text x="856" y="844" class="text"><tspan class="code">service-host</tspan> runs the entrypoint under</text>
  <text x="856" y="866" class="text">the hardened profile with no Kubernetes</text>
  <text x="856" y="888" class="text">or cloud credential; Ready by Runtime</text>
  <text x="856" y="910" class="text">Host calls or once its port opens</text>

  <!-- 5 Lifecycle and allocation -->
  <path d="M1180 924 V1004 H750" fill="none" stroke="#138b8d" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrowTeal)"/>
  <text x="840" y="994" class="edgeTeal">Runtime Host v1, Pod-local relay</text>

  <rect x="396" y="954" width="348" height="100" rx="14" fill="#ffffff" stroke="#91b8d7" stroke-width="1.5"/>
  <text x="416" y="982" class="node">5  Lifecycle and allocation</text>
  <text x="416" y="1008" class="text">per-instance health, Ready and drain;</text>
  <text x="416" y="1030" class="text">selects and allocates a Ready instance</text>

  <rect x="56" y="954" width="248" height="120" rx="14" fill="#f3effa" stroke="#b7a3de" stroke-width="1.5"/>
  <text x="76" y="982" class="sdkNode">Players</text>
  <text x="76" y="1008" class="code">POST /v1/servers/start</text>
  <text x="76" y="1030" class="text">via the application gateway,</text>
  <text x="76" y="1052" class="text">then dial host:port directly</text>

  <path d="M304 1004 H390" fill="none" stroke="#466785" stroke-width="2.5" marker-end="url(#arrow)"/>
  
  <!-- Delivery API note -->
  <rect x="40" y="1114" width="1200" height="66" rx="14" fill="#f7f9fb" stroke="#8a9bab" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="60" y="1140" class="foot"><tspan class="footStrong">Delivery API for CI (off by default):</tspan> <tspan class="code">/api/v1/delivery</tspan> on its own TLS host with a short-lived workload OIDC token; preview, idempotency, polling or SSE.</text>
  <text x="60" y="1164" class="foot">It submits a credential-free locator with bundle, manifest, SBOM and scan digests, and never receives Kubernetes or cloud credentials.</text>
</svg>
