<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ko" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
  <title id="title">Yogabase 작동 방식: Control Plane, member 클러스터, 각 SDK가 연결되는 지점</title>
  <desc id="desc">하나의 Helm 차트는 두 가지 모드로 실행됩니다. control-plane 모드에서 Control Plane은 유일한 권위입니다. 명명된 Console 시트 또는 외부 OIDC 공급자로 로그인하는 Blazor Console, /api/v1 아래의 REST API, 별도 TLS 호스트의 워크로드 전용 Delivery API(/api/v1/delivery), 프로젝트 범위 ybt_ 개발자 토큰으로 인증하는 Builds 수집 경로가 모두 설치본 승인 정책 아래에서 revision 검사와 감사를 거치는 작업과 승인으로 이어지고, 이는 기본값이 RF1인 내부 YSQL 카탈로그에 기록됩니다. fleet gateway는 서명되고 순번이 붙은 명령을 보냅니다. ICloudProvisioner 뒤의 Pulumi .NET인 선택적 Provisioner는 프로비저닝을 켠 경우에만 렌더링됩니다. 각 member 클러스터와, 자신을 member로 등록하는 Control Plane 자체 클러스터에서 Agent는 상호 인증 gRPC로 fleet gateway에 아웃바운드 연결합니다. 서명된 의도는 아래로, 인벤토리와 관찰은 위로 흐르며 인바운드 member API는 없습니다. 같은 세션이 Console의 Lambda 및 schema-runner 호출, runtime-host 호출, /v1/servers 호출도 relay합니다. Agent는 서명된 Yogabase CRD를 저장하고, 로컬 actuator인 Yogabase.Operator는 Yogabase 워크로드를 쓰는 유일한 구성 요소로서 YogaDatabase, YogaDatabaseOperation, YogaApplicationRuntime, YogaValkey, YogaRobustMQCluster를 조정합니다. Yogabase.Tasks 역할에는 application-gateway, SignalR용 realtime-gateway, service-materializer와 service-host가 실행하는 호스팅 서비스, lambda-worker, scheduler, jobs, consumer, artifact-builder, sandbox-broker와 sandbox-worker가 맡는 Lambda 실행, Orleans를 실행하는 유일한 프로세스인 선택적 orleans-silo, Console의 DDL/DML을 digest 바인딩 마이그레이션으로 실행하는 schema-runner, artifact-admission, 선택적 object-store가 있습니다. 엔진은 YSQL만 지원하는 YugabyteDB와, Yogabase 소유 C# 코드가 조정하는 선택적 Valkey 및 RobustMQ 모듈입니다. .NET, TypeScript, Python, Java, Dart 애플리케이션 SDK는 HTTPS로 application-gateway를, 별도 origin의 SignalR로 realtime-gateway를 호출합니다. 게임 클라이언트는 할당된 인스턴스의 host:port에 직접 접속합니다. Delivery 클라이언트는 Delivery API를, YogabaseBuildsClient와 Unity Editor 게시 도구는 Builds 수집 경로를 호출합니다. 호스팅된 서버 Pod 안의 runtime-host 클라이언트는 Pod 로컬 relay와만 통신합니다. sandbox 안의 Yogabase.Lambda는 DbDataSource로 프로젝트 데이터베이스에, 게이트웨이의 내부 Lambda runtime API로 Storage, Users, Realtime 및 MQTT/Kafka/AMQP 게시에, 프로젝트 ACL ID와 TLS로 Valkey에 직접 접근합니다. Secret 값은 브라우저 상태, CRD status, 로그, 감사 기록에 들어가지 않습니다. 클라이언트 Data API 복원과 Lambda의 타입 지정 데이터 API 및 Entity Framework Core는 2026-09-17에 결정되었지만 아직 제공되지 않으므로 Data API는 그리지 않았습니다.</desc>
