  <text x="40" y="1054" class="foot">Secret 값은 브라우저 상태, CRD status, 로그, 감사 기록에 들어가지 않습니다. actuator는 임의의 Secret을 읽지 않고 pods/exec를 사용하지 않습니다.</text>
  <text x="40" y="1078" class="foot">2026-09-17에 결정되었지만 아직 제공되지 않음: 복원될 클라이언트 Data API, Lambda 안의 타입 지정 데이터 API와 EF Core. Data API는 그리지 않았습니다.</text>
