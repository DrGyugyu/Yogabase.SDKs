<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="1040" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif">
  <title>Yogabase(EKS 베타) 아키텍처 — 모든 운영 요소는 고객의 AWS 계정 안에 있습니다</title>
  <desc>Yogabase는 고객의 AWS 계정 안에서 완전히 실행됩니다. Control Plane 클러스터는 Console, API, Provisioner, 내부 카탈로그와 YugabyteDB 노드 풀을 호스팅합니다. member 클러스터는 아웃바운드로만 연결됩니다. 계정 경계를 넘는 경로는 로그인 연동, AWS Marketplace ECR 이미지 풀, 고객이 소유한 선택적 백업 대상뿐입니다.</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#2f5597"/>
    </marker>
    <marker id="arrowgrey" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#5a6b82"/>
    </marker>
  </defs>

  <rect width="1040" height="660" fill="#ffffff"/>

  <text x="24" y="34" font-size="20" font-weight="bold" fill="#1f3864">Yogabase (EKS 베타)</text>
  <text x="24" y="52" font-size="12.5" fill="#5a6b82">Amazon EKS에서 YugabyteDB를 운영하는 하나의 Control Plane — 고객 계정 안에서 실행됩니다.</text>

  <!-- Account boundary -->
  <rect x="24" y="64" width="820" height="572" rx="12" fill="#f7f9fc" stroke="#1f3864" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="44" y="90" font-size="17" font-weight="bold" fill="#1f3864">고객의 AWS 계정</text>
  <text x="44" y="110" font-size="12.5" fill="#41546f">모든 데이터베이스, Secret 및 운영 상태가 이 경계 안에 유지됩니다.</text>

  <!-- Control Plane cluster -->
  <rect x="48" y="130" width="422" height="332" rx="10" fill="#ffffff" stroke="#2f5597" stroke-width="2"/>
  <text x="66" y="154" font-size="14.5" font-weight="bold" fill="#2f5597">Amazon EKS — Control Plane 클러스터</text>
  <text x="66" y="172" font-size="11.5" fill="#5a6b82">Yogabase Helm 차트로 한 번 설치</text>

  <rect x="66" y="186" width="180" height="68" rx="7" fill="#eaf1fb" stroke="#2f5597"/>
  <text x="80" y="208" font-size="12.5" font-weight="bold" fill="#1f3864">Console 및 REST API</text>
  <text x="80" y="226" font-size="10.5" fill="#41546f">Blazor Console, 보호된</text>
  <text x="80" y="241" font-size="10.5" fill="#41546f">작업 및 승인</text>

  <rect x="258" y="186" width="194" height="68" rx="7" fill="#eaf1fb" stroke="#2f5597"/>
  <text x="272" y="208" font-size="12.5" font-weight="bold" fill="#1f3864">Provisioner</text>
  <text x="272" y="226" font-size="10.5" fill="#41546f">Pulumi 프로그램, 암호화된</text>
  <text x="272" y="241" font-size="10.5" fill="#41546f">상태는 클러스터에 보관</text>

  <rect x="66" y="266" width="180" height="66" rx="7" fill="#eaf1fb" stroke="#2f5597"/>
  <text x="80" y="288" font-size="12.5" font-weight="bold" fill="#1f3864">내부 카탈로그</text>
  <text x="80" y="306" font-size="10.5" fill="#41546f">Yogabase 메타데이터</text>
  <text x="80" y="321" font-size="10.5" fill="#41546f">데이터베이스(RF1)</text>

  <rect x="258" y="266" width="194" height="66" rx="7" fill="#eaf1fb" stroke="#2f5597"/>
  <text x="272" y="288" font-size="12.5" font-weight="bold" fill="#1f3864">로컬 actuator</text>
  <text x="272" y="306" font-size="10.5" fill="#41546f">Yogabase 소유 워크로드의</text>
  <text x="272" y="321" font-size="10.5" fill="#41546f">유일한 기록자</text>

  <rect x="66" y="344" width="386" height="100" rx="7" fill="#fdf3e3" stroke="#b26a00" stroke-width="1.6"/>
  <text x="80" y="367" font-size="13" font-weight="bold" fill="#8a5200">YugabyteDB 노드 풀</text>
  <text x="80" y="387" font-size="10.5" fill="#6b4a12">고객 데이터베이스. 이 베타에서는 YSQL 및 복제 계수 1만 지원합니다.</text>
  <text x="80" y="405" font-size="10.5" fill="#6b4a12">용도 한정 엔진 이미지: 셸·패키지 관리자 없음, non-root,</text>
  <text x="80" y="423" font-size="10.5" fill="#6b4a12">다이제스트 고정, PostgreSQL 15.19 보안 기준선.</text>

  <!-- Member cluster -->
  <rect x="560" y="130" width="260" height="196" rx="10" fill="#ffffff" stroke="#2f5597" stroke-width="2"/>
  <text x="578" y="154" font-size="14" font-weight="bold" fill="#2f5597">Amazon EKS — member</text>
  <text x="578" y="172" font-size="11.5" fill="#5a6b82">선택 사항; 동일 차트의 member 모드</text>

  <rect x="578" y="186" width="224" height="76" rx="7" fill="#eaf1fb" stroke="#2f5597"/>
  <text x="592" y="207" font-size="12.5" font-weight="bold" fill="#1f3864">Agent + 로컬 actuator</text>
  <text x="592" y="225" font-size="10.5" fill="#41546f">Control Plane에 아웃바운드 연결</text>
  <text x="592" y="240" font-size="10.5" fill="#41546f">상호 TLS gRPC 사용</text>
  <text x="592" y="255" font-size="10.5" font-weight="bold" fill="#1f3864">인바운드 엔드포인트 없음</text>

  <rect x="578" y="274" width="224" height="38" rx="7" fill="#fdf3e3" stroke="#b26a00" stroke-width="1.6"/>
  <text x="592" y="298" font-size="11" fill="#6b4a12">Yogabase 소유 vCPU당 과금</text>

  <!-- Outbound-only connection, drawn in the gutter between the two clusters -->
  <path d="M 558 216 L 472 216" stroke="#2f5597" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <text x="515" y="207" font-size="10" font-weight="bold" fill="#2f5597" text-anchor="middle">아웃바운드</text>
  <text x="515" y="232" font-size="10" fill="#5a6b82" text-anchor="middle">전용</text>

  <!-- Identity -->
  <rect x="560" y="344" width="260" height="100" rx="10" fill="#ffffff" stroke="#2f7d4f" stroke-width="2"/>
  <text x="578" y="368" font-size="13.5" font-weight="bold" fill="#2f7d4f">계정 안의 로그인</text>
  <text x="578" y="388" font-size="11" fill="#41546f">IAM Identity Center,</text>
  <text x="578" y="405" font-size="11" fill="#41546f">설치 소유 Cognito 사용자 풀</text>
  <text x="578" y="422" font-size="11" fill="#41546f">연동</text>
  <text x="578" y="438" font-size="11" font-weight="bold" fill="#2f7d4f">비밀번호 DB 없음</text>

  <!-- Optional backup -->
  <rect x="48" y="476" width="422" height="80" rx="10" fill="#ffffff" stroke="#5a6b82" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="66" y="500" font-size="13" font-weight="bold" fill="#41546f">백업 대상(선택 사항, 기본 비활성)</text>
  <text x="66" y="520" font-size="11" fill="#5a6b82">고객이 소유하고 구성하는 객체 저장소입니다. Yogabase는</text>
  <text x="66" y="538" font-size="11" fill="#5a6b82">고객 대신 대상을 선택하지 않습니다.</text>

  <rect x="560" y="476" width="260" height="80" rx="10" fill="#ffffff" stroke="#5a6b82" stroke-width="1.8"/>
  <text x="578" y="500" font-size="13" font-weight="bold" fill="#41546f">여기에 없는 것</text>
  <text x="578" y="520" font-size="11" fill="#5a6b82">벤더 호스팅 서비스,</text>
  <text x="578" y="538" font-size="11" fill="#5a6b82">텔레메트리, phone-home 없음</text>

  <text x="48" y="584" font-size="10.5" fill="#5a6b82">Secret은 고객 클러스터의 Kubernetes Secret으로만 존재합니다. Helm values, 리소스 상태, 로그에는 들어가지 않습니다.</text>
  <text x="48" y="602" font-size="10.5" fill="#5a6b82">감사 기록, 지원 번들 또는 브라우저 상태에도 포함되지 않습니다.</text>

  <!-- Outside the account -->
  <rect x="868" y="130" width="148" height="118" rx="10" fill="#f2f2f5" stroke="#5a6b82" stroke-width="1.8"/>
  <text x="882" y="154" font-size="12.5" font-weight="bold" fill="#41546f">AWS Marketplace</text>
  <text x="882" y="171" font-size="12.5" font-weight="bold" fill="#41546f">ECR</text>
  <text x="882" y="194" font-size="10.5" fill="#5a6b82">서명·다이제스트 고정</text>
  <text x="882" y="211" font-size="10.5" fill="#5a6b82">amd64 및 arm64</text>
  <text x="882" y="228" font-size="10.5" fill="#5a6b82">이미지</text>

  <path d="M 866 268 L 846 268" stroke="#5a6b82" stroke-width="2.2" fill="none" marker-end="url(#arrowgrey)"/>
  <text x="1016" y="268" font-size="10.5" fill="#5a6b82" text-anchor="end">이미지 풀</text>

  <text x="868" y="326" font-size="11.5" font-weight="bold" fill="#41546f">경계를 넘는 항목:</text>
  <text x="868" y="350" font-size="10.5" fill="#5a6b82">1. 로그인 연동</text>
  <text x="868" y="368" font-size="10.5" fill="#5a6b82">2. 이미지 풀</text>
  <text x="868" y="386" font-size="10.5" fill="#5a6b82">3. 고객이 선택한</text>
  <text x="868" y="402" font-size="10.5" fill="#5a6b82">    백업 대상</text>
  <text x="868" y="428" font-size="10.5" font-weight="bold" fill="#41546f">그 외 없음</text>
</svg>
