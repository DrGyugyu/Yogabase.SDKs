[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "stackyoga-yogabase-client-preview"
version = "0.2.0.dev1"
description = "Unpublished generated preview client for Yogabase"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.md"]
dependencies = ["microsoft-kiota-bundle==1.9.10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["stackyoga_yogabase*"]
namespaces = true
