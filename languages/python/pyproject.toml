[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stackyoga-yogabase-client-preview"
version = "0.4.0.dev1"
description = "Unpublished application and workload-delivery client preview for Yogabase"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.md"]
dependencies = ["microsoft-kiota-bundle==1.9.10", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["stackyoga_yogabase*"]
namespaces = true
